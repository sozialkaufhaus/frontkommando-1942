    <line x1="344" y1="240" x2="320" y2="196" stroke="#9aa697" stroke-width="5"/>
    <rect x="282" y="182" width="74" height="20" rx="4" fill="url(#metal)" stroke="#cfdacc"/>
    <line x1="356" y1="190" x2="462" y2="184" stroke="#e0e8dc" stroke-width="7" stroke-linecap="round"/>
    <polygon points="468,184 510,168 498,184 510,200" fill="#ffb84d" fill-opacity="0.75"/>
