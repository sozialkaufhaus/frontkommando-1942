    <line x1="175" y1="274" x2="310" y2="246" stroke="#6f7b6e" stroke-width="8" stroke-linecap="round"/>
    <path d="M 290 250 L 312 162 L 368 176 L 348 256 Z" fill="url(#metal)" stroke="#cbd6c7" stroke-width="2.5"/>
    <line x1="346" y1="198" x2="532" y2="188" stroke="#dfe8dc" stroke-width="10" stroke-linecap="round"/>
    <rect x="524" y="180" width="22" height="16" rx="2" fill="#e4bc6a"/>
    <circle cx="310" cy="248" r="28" fill="#1b201c" stroke="#a6b3a2" stroke-width="6"/>
    <circle cx="310" cy="248" r="9" fill="#d9a544"/>
