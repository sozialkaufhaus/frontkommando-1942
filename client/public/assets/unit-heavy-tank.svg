<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="68%">
      <stop offset="0%" stop-color="#222a24"/>
      <stop offset="55%" stop-color="#141816"/>
      <stop offset="100%" stop-color="#0a0c0b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="62%" r="42%">
      <stop offset="0%" stop-color="#e08b36" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#e08b36" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#e08b36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c877b"/>
      <stop offset="45%" stop-color="#475046"/>
      <stop offset="100%" stop-color="#222723"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3c669"/>
      <stop offset="100%" stop-color="#8b6423"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#a69c7c" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>
  <ellipse cx="320" cy="220" rx="280" ry="130" fill="url(#glow)"/>
  <!-- Subtle tactical contour rings -->
  <ellipse cx="320" cy="255" rx="240" ry="52" fill="none" stroke="#c7b68a" stroke-opacity="0.11" stroke-width="1.2" stroke-dasharray="6 6"/>
  <ellipse cx="320" cy="255" rx="165" ry="34" fill="none" stroke="#c7b68a" stroke-opacity="0.14" stroke-width="1"/>
  <!-- Corner reticles -->
  <path d="M 20 42 L 20 20 L 42 20 M 620 42 L 620 20 L 598 20 M 20 318 L 20 340 L 42 340 M 620 318 L 620 340 L 598 340" fill="none" stroke="#d9a544" stroke-opacity="0.45" stroke-width="2"/>
  <g>
    <!-- Massive armored hull -->
    <path d="M 155 232 L 195 190 L 425 190 L 460 228 L 445 256 L 170 256 Z" fill="url(#metal)" stroke="#b6c4b2" stroke-opacity="0.5" stroke-width="2"/>
    <!-- Tracks & roadwheels -->
    <rect x="165" y="236" width="286" height="38" rx="19" fill="#181c19" stroke="#8f9b8c" stroke-width="3"/>
    <circle cx="195" cy="255" r="13" fill="#464f46" stroke="#a6b2a2" stroke-width="2"/>
    <circle cx="236" cy="255" r="13" fill="#464f46" stroke="#a6b2a2" stroke-width="2"/>
    <circle cx="277" cy="255" r="13" fill="#464f46" stroke="#a6b2a2" stroke-width="2"/>
    <circle cx="318" cy="255" r="13" fill="#464f46" stroke="#a6b2a2" stroke-width="2"/>
    <circle cx="359" cy="255" r="13" fill="#464f46" stroke="#a6b2a2" stroke-width="2"/>
    <circle cx="400" cy="255" r="13" fill="#464f46" stroke="#a6b2a2" stroke-width="2"/>
    <circle cx="430" cy="255" r="11" fill="#464f46" stroke="#a6b2a2" stroke-width="2"/>
    <!-- Heavy turret -->
    <path d="M 232 190 L 248 140 L 368 140 L 386 190 Z" fill="url(#metal)" stroke="#cbd6c7" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="270" y="128" width="38" height="12" rx="3" fill="#596458"/>
    <!-- Long heavy 88mm-style cannon + muzzle brake -->
    <line x1="378" y1="162" x2="546" y2="152" stroke="#c8d4c4" stroke-width="9" stroke-linecap="round"/>
    <rect x="538" y="144" width="22" height="16" rx="2" fill="#e4bc6a"/>
  </g>
  <!-- Horizon ground line -->
  <line x1="56" y1="276" x2="584" y2="276" stroke="#c9b88b" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- Tactical stamp -->
  <rect x="26" y="24" width="136" height="22" rx="2" fill="#0d100e" fill-opacity="0.72" stroke="#d9a544" stroke-opacity="0.4"/>
  <text x="36" y="39" font-family="monospace" font-size="11" fill="#e4bc6a" letter-spacing="1.5">PZ-VI // SCHWER</text>
</svg>