<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="68%">
      <stop offset="0%" stop-color="#222a24"/>
      <stop offset="55%" stop-color="#141816"/>
      <stop offset="100%" stop-color="#0a0c0b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="62%" r="42%">
      <stop offset="0%" stop-color="#c89b49" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#c89b49" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c89b49" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c877b"/>
      <stop offset="45%" stop-color="#475046"/>
      <stop offset="100%" stop-color="#222723"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3c669"/>
      <stop offset="100%" stop-color="#8b6423"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#a69c7c" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>
  <ellipse cx="320" cy="220" rx="280" ry="130" fill="url(#glow)"/>
  <!-- Subtle tactical contour rings -->
  <ellipse cx="320" cy="255" rx="240" ry="52" fill="none" stroke="#c7b68a" stroke-opacity="0.11" stroke-width="1.2" stroke-dasharray="6 6"/>
  <ellipse cx="320" cy="255" rx="165" ry="34" fill="none" stroke="#c7b68a" stroke-opacity="0.14" stroke-width="1"/>
  <!-- Corner reticles -->
  <path d="M 20 42 L 20 20 L 42 20 M 620 42 L 620 20 L 598 20 M 20 318 L 20 340 L 42 340 M 620 318 L 620 340 L 598 340" fill="none" stroke="#d9a544" stroke-opacity="0.45" stroke-width="2"/>
  <g>
    <!-- Three tactical infantry silhouettes with helmets & rifles -->
    <g fill="url(#metal)" stroke="#b6c2b2" stroke-opacity="0.45" stroke-width="1.5">
      <!-- Soldier Left -->
      <path d="M 215 150 Q 230 132 245 150 Z"/>
      <circle cx="230" cy="158" r="10"/>
      <path d="M 208 276 L 216 172 L 244 172 L 252 276 Z"/>
      <line x1="238" y1="194" x2="292" y2="162" stroke="#d9a544" stroke-width="4" stroke-linecap="round"/>
      <!-- Soldier Center (forward) -->
      <path d="M 298 134 Q 318 112 338 134 Z"/>
      <circle cx="318" cy="144" r="12"/>
      <path d="M 290 276 L 300 160 L 336 160 L 346 276 Z"/>
      <line x1="330" y1="186" x2="404" y2="150" stroke="#e4bc6a" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Soldier Right -->
      <path d="M 388 152 Q 403 135 418 152 Z"/>
      <circle cx="403" cy="160" r="10"/>
      <path d="M 382 276 L 390 174 L 416 174 L 424 276 Z"/>
      <line x1="412" y1="196" x2="466" y2="168" stroke="#d9a544" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- Sandbag parapet -->
    <ellipse cx="180" cy="272" rx="34" ry="12" fill="#3a4038" stroke="#6f786c"/>
    <ellipse cx="235" cy="274" rx="34" ry="12" fill="#3a4038" stroke="#6f786c"/>
    <ellipse cx="450" cy="272" rx="34" ry="12" fill="#3a4038" stroke="#6f786c"/>
  </g>
  <!-- Horizon ground line -->
  <line x1="56" y1="276" x2="584" y2="276" stroke="#c9b88b" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- Tactical stamp -->
  <rect x="26" y="24" width="136" height="22" rx="2" fill="#0d100e" fill-opacity="0.72" stroke="#d9a544" stroke-opacity="0.4"/>
  <text x="36" y="39" font-family="monospace" font-size="11" fill="#e4bc6a" letter-spacing="1.5">TRUPP // INF</text>
</svg>